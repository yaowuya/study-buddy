services:
  studybuddy-api:
    build: .
    container_name: studybuddy-api-2.0
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - studybuddy_logs:/app/logs
      - ./tmp:/app/tmp

volumes:
  studybuddy_logs:
