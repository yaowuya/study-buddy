services:
  studybuddy-api:
    build:
      context: .
      args:
        APP_VERSION: "1.2.0"
    image: studybuddy-api:1.2.0
    container_name: studybuddy-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /data/logs/studybuddy:/app/logs
      - ./tmp:/app/tmp
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
