<!DOCTYPE html>

<html lang="zh"><head>

        darkMode: "class",

          extend: {

                    "on-tertiary-fixed": "#00201d",

                    "inverse-surface": "#263140",
                    "primary-fixed": "#d8e2ff",

                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "surface-bright": "#f8f9ff",
                    "surface-dim": "#cfdbee",
                    "inverse-primary": "#adc6ff",
                    "error-container": "#ffdad6",
                    "surface-container-low": "#eff4ff",
                    "surface-variant": "#d8e3f7",
                    "tertiary-container": "#008379",
                    "on-surface-variant": "#414754",
                    "inverse-on-surface": "#eaf1ff",
                    "secondary-container": "#ffd167",
                    "primary": "#0058bd",
                    "on-error-container": "#93000a",
                    "secondary": "#785a00",
                    "surface-tint": "#005ac2",
                    "surface-container-highest": "#d8e3f7",
                    "on-tertiary": "#ffffff",
                    "on-secondary-container": "#765900",
                    "background": "#f8f9ff",
                    "surface": "#f8f9ff",
                    "primary-container": "#1470e8",
                    "tertiary-fixed": "#70f8e8",
                    "on-primary-fixed-variant": "#004494",
                    "tertiary": "#00685f",
                    "surface-container": "#e6eeff",
                    "on-background": "#111c2a",
                    "on-tertiary-fixed-variant": "#005049",
                    "tertiary-fixed-dim": "#4fdbcc",
                    "error": "#ba1a1a",

                    "on-surface": "#111c2a",
                    "on-primary-fixed": "#001a41",
                    "primary-fixed-dim": "#adc6ff",
                    "secondary-fixed": "#ffdf9b",
                    "on-secondary-fixed": "#251a00",
                    "secondary-fixed-dim": "#edc157",
                    "on-tertiary-container": "#f4fffc",

                    "outline-variant": "#c2c6d6"
            },

                    "DEFAULT": "0.25rem",

            "spacing": {

                    "md": "20px",
                    "base": "8px",
                    "xl": "48px",
                    "sm": "12px",
                    "gutter": "16px",
                    "lg": "32px",
                    "margin": "24px"
            },
            "fontFamily": {
                    "body-lg": ["Plus Jakarta Sans"],
                    "headline-xl": ["Lexend"],
                    "label-md": ["Lexend"],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-body-md text-on-background selection:bg-primary-container selection:text-on-primary-container">
<!-- Shared Component: TopAppBar -->
<header class="bg-white dark:bg-slate-900 docked full-width top-0 sticky z-50 border-b-2 border-slate-100 dark:border-slate-800 shadow-sm flex justify-between items-center w-full px-6 py-3">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden border border-outline-variant">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">face</span>
</div>
<span class="font-lexend font-bold text-lg tracking-tight text-blue-500 dark:text-blue-400">Parent Profile</span>
</div>
<div class="text-xl font-black text-blue-600 dark:text-blue-400">
            Homework Companion
        </div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-blue-500 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/30 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pb-32 px-md py-margin flex flex-col gap-margin max-w-3xl mx-auto w-full">
<!-- Page Title -->
<div class="flex flex-col gap-xs">
<h1 class="font-headline-xl text-headline-xl text-on-surface">布置新任务</h1>
<p class="font-body-md text-body-md text-on-surface-variant">为您孩子的每日学习计划添加新内容。</p>
</div>
<!-- Bento Grid / Stacked Forms -->
<form class="flex flex-col gap-lg w-full">
<!-- Basic Info Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col gap-md shadow-[0_8px_24px_rgba(0,88,189,0.04)] border border-surface-container-high">
<!-- Task Title -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-xs" for="task-title">
<span class="material-symbols-outlined text-outline" style="font-size: 18px;">title</span>
                        任务标题
                    </label>
<input class="w-full bg-surface-bright border-2 border-outline-variant rounded-xl px-sm py-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:bg-surface-container-low focus:ring-0 transition-colors outline-none shadow-sm" id="task-title" placeholder="例如：完成课后练习题" type="text"/>
</div>
<!-- Subject Selection (Chunky Chips) -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-xs">
<span class="material-symbols-outlined text-outline" style="font-size: 18px;">category</span>
                        科目选择
                    </label>
<div class="grid grid-cols-3 gap-sm">
<!-- Active Subject -->
<label class="cursor-pointer group">
<input checked="" class="peer sr-only" name="subject" type="radio" value="chinese"/>
<div class="flex flex-col items-center justify-center gap-xs py-sm rounded-xl border-2 border-primary bg-primary-container text-on-primary-container shadow-[0_2px_0_#004494] active:translate-y-[2px] active:shadow-none transition-all">
<span class="material-symbols-outlined fill" style="font-size: 24px;">language</span>
<span class="font-label-sm text-label-sm">语文</span>
</div>
</label>
<!-- Inactive Subjects -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="subject" type="radio" value="math"/>
<div class="flex flex-col items-center justify-center gap-xs py-sm rounded-xl border-2 border-outline-variant bg-surface-bright text-on-surface-variant hover:bg-surface-container-high peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:shadow-[0_2px_0_#004494] transition-all">
<span class="material-symbols-outlined" style="font-size: 24px;">calculate</span>
<span class="font-label-sm text-label-sm">数学</span>
</div>
</label>
<label class="cursor-pointer group">
<input class="peer sr-only" name="subject" type="radio" value="english"/>
<div class="flex flex-col items-center justify-center gap-xs py-sm rounded-xl border-2 border-outline-variant bg-surface-bright text-on-surface-variant hover:bg-surface-container-high peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container peer-checked:shadow-[0_2px_0_#004494] transition-all">
<span class="material-symbols-outlined" style="font-size: 24px;">school</span>
<span class="font-label-sm text-label-sm">英语</span>
</div>
</label>
</div>
</div>
</div>
<!-- Dictation Settings (Special Request Feature) -->
<div class="bg-[#f0fdf4] dark:bg-[#052e16]/20 rounded-[24px] p-md flex flex-col gap-md border-2 border-[#bbf7d0] dark:border-[#166534] shadow-[0_8px_24px_rgba(34,197,94,0.06)] relative overflow-hidden">
<!-- Decorative element -->
<div class="absolute -right-4 -top-4 w-24 h-24 bg-[#bbf7d0]/40 rounded-full blur-xl"></div>
<div class="flex items-center justify-between relative z-10">
<div class="flex items-center gap-sm text-[#166534] dark:text-[#4ade80]">
<span class="material-symbols-outlined fill bg-[#dcfce7] p-1.5 rounded-lg" style="font-size: 20px;">spellcheck</span>
<h3 class="font-headline-lg text-headline-lg text-[20px] leading-tight">听写设置</h3>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-outline-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-[#22c55e]"></div>
</label>
</div>
<p class="font-body-md text-body-md text-[#166534]/80 text-[14px] leading-snug relative z-10">
                    输入需要听写的生字或单词，我们将为您生成专门的听写卡片。
                </p>
<div class="flex flex-col gap-sm relative z-10">
<div class="flex gap-sm">
<input class="flex-1 bg-white border-2 border-[#bbf7d0] rounded-xl px-sm py-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-[#22c55e] focus:ring-0 transition-colors outline-none shadow-sm" placeholder="输入生字词..." type="text"/>
<button class="bg-[#22c55e] text-white rounded-xl px-md font-label-md text-label-md flex items-center justify-center gap-xs shadow-[0_3px_0_#166534] active:translate-y-[3px] active:shadow-none transition-all" type="button">
<span class="material-symbols-outlined" style="font-size: 18px;">add</span>
                            添加
                        </button>
</div>
<!-- Added Words Tags -->
<div class="flex flex-wrap gap-xs mt-xs">
<span class="inline-flex items-center gap-xs px-3 py-1.5 rounded-lg bg-white border border-[#bbf7d0] font-label-sm text-label-sm text-[#166534]">
                            苹果
                            <span class="material-symbols-outlined cursor-pointer hover:text-error" style="font-size: 16px;">close</span>
</span>
<span class="inline-flex items-center gap-xs px-3 py-1.5 rounded-lg bg-white border border-[#bbf7d0] font-label-sm text-label-sm text-[#166534]">
                            香蕉
                            <span class="material-symbols-outlined cursor-pointer hover:text-error" style="font-size: 16px;">close</span>
</span>
<span class="inline-flex items-center gap-xs px-3 py-1.5 rounded-lg bg-white border border-[#bbf7d0] font-label-sm text-label-sm text-[#166534]">
                            葡萄
                            <span class="material-symbols-outlined cursor-pointer hover:text-error" style="font-size: 16px;">close</span>
</span>
</div>
</div>
</div>
<!-- Details & Deadline Card -->
<div class="bg-surface-container-lowest rounded-[24px] p-md flex flex-col gap-md shadow-[0_8px_24px_rgba(0,88,189,0.04)] border border-surface-container-high">
<!-- Deadline -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-xs" for="deadline">
<span class="material-symbols-outlined text-outline" style="font-size: 18px;">event</span>
                        截止日期
                    </label>
<input class="w-full bg-surface-bright border-2 border-outline-variant rounded-xl px-sm py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:bg-surface-container-low focus:ring-0 transition-colors outline-none shadow-sm" id="deadline" type="datetime-local"/>
</div>
<!-- Description -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-xs" for="description">
<span class="material-symbols-outlined text-outline" style="font-size: 18px;">description</span>
                        详细说明
                    </label>
<textarea class="w-full bg-surface-bright border-2 border-outline-variant rounded-xl px-sm py-sm font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:bg-surface-container-low focus:ring-0 transition-colors outline-none shadow-sm resize-none" id="description" placeholder="请详细描述作业的具体要求..." rows="3"></textarea>
</div>
<!-- Image Attachment Upload -->
<div class="flex flex-col gap-base mt-xs">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-xs">
<span class="material-symbols-outlined text-outline" style="font-size: 18px;">attachment</span>
                        图片附件上传
                    </label>
<div class="w-full border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm bg-surface-bright cursor-pointer hover:border-primary hover:bg-surface-container-low transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-variant flex items-center justify-center group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-outline group-hover:text-primary transition-colors" style="font-size: 28px;">add_photo_alternate</span>
</div>
<div class="text-center">
<p class="font-label-md text-label-md text-on-surface">点击或拖拽上传图片</p>
<p class="font-label-sm text-label-sm text-outline mt-1">支持 JPG, PNG格式，最大5MB</p>
</div>
</div>
</div>
</div>
<!-- Submit Action -->
<button class="w-full bg-primary text-on-primary font-headline-lg text-headline-lg text-[20px] py-md rounded-[20px] shadow-[0_6px_0_#004494] active:translate-y-[6px] active:shadow-none transition-all flex justify-center items-center gap-sm mt-sm" type="button">
<span class="material-symbols-outlined fill" style="font-size: 24px;">send</span>
                发布作业
            </button>
</form>
</main>
<!-- Shared Component: BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 border-t-2 border-slate-100 dark:border-slate-800 pb-safe tonal-shift-bg shadow-[0_-4px_10px_rgba(58,134,255,0.05)] bg-white dark:bg-slate-900 flex justify-around items-center h-20 px-4 md:hidden">
<!-- Item 0: 作业 (Inactive) -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-1.5 hover:text-blue-400 dark:hover:text-blue-300 active:translate-y-0.5 active:shadow-none transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="auto_stories">auto_stories</span>
<span class="font-lexend font-medium text-[12px] mt-1">作业</span>
</a>
<!-- Item 1: 布置 (Active - Matching Intent) -->
<a class="flex flex-col items-center justify-center bg-blue-100 dark:bg-blue-900/40 text-blue-700 dark:text-blue-200 rounded-2xl px-5 py-1.5 transition-all duration-300 active:translate-y-0.5 active:shadow-none transition-transform" href="#">
<span class="material-symbols-outlined fill" data-icon="add_circle">add_circle</span>
<span class="font-lexend font-medium text-[12px] mt-1">布置</span>
</a>
<!-- Item 2: 历史 (Inactive) -->
<a class="flex flex-col items-center justify-center text-slate-400 dark:text-slate-500 px-5 py-1.5 hover:text-blue-400 dark:hover:text-blue-300 active:translate-y-0.5 active:shadow-none transition-transform" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-lexend font-medium text-[12px] mt-1">历史</span>
</a>
</nav>
</body></html>
