<style>
        .blob-shape {
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation: morph 8s ease-in-out infinite;
        }
        @keyframes morph {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
        }
        
        .organic-card-1 { border-radius: 65% 35% 58% 42% / 47% 41% 59% 53%; }
        .organic-card-2 { border-radius: 45% 55% 42% 58% / 54% 48% 52% 46%; }
        .organic-card-3 { border-radius: 51% 49% 63% 37% / 41% 58% 42% 59%; }
        .organic-card-4 { border-radius: 38% 62% 48% 52% / 57% 44% 56% 43%; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-alt text-on-background min-h-screen relative overflow-hidden font-body-md text-body-md">
<!-- Decorative Background Shape (Behind Overlay) -->
<div class="absolute top-0 left-0 w-[500px] h-[500px] bg-soft-lilac opacity-40 blob-shape -translate-x-1/2 -translate-y-1/2 -z-10 blur-[80px]"></div>
<!-- Mock Main Content Behind Overlay -->
<header class="w-full top-0 flex items-center justify-between px-container-margin py-4 w-full relative opacity-30">
<button class="text-primary"><span class="material-symbols-outlined">arrow_back</span></button>
<div class="w-6"></div>
</header>
<!-- Dialog Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-container-margin bg-on-background/20 backdrop-blur-sm">
<!-- Popup Dialog -->
<div class="bg-surface-container-lowest/95 backdrop-blur-md w-full max-w-sm rounded-[32px] p-6 pb-12 shadow-[0_20px_60px_rgba(0,0,0,0.1)] relative border border-white/40">
<!-- Header -->
<div class="flex items-center justify-between mb-6">
<h1 class="font-headline-h2 text-headline-h1-mobile text-primary">听写预览</h1>
<button class="text-text-secondary hover:text-primary transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex justify-between items-center mb-6">
<span class="text-text-secondary font-body-md">共 8 个词语</span>
<button class="text-primary hover:opacity-80 flex items-center gap-1 text-sm font-medium bg-surface-container-highest/50 px-3 py-1.5 rounded-full">
<span class="material-symbols-outlined text-[18px]">shuffle</span>
                乱序
            </button>
</div>
<!-- Words Grid -->
<div class="grid grid-cols-2 gap-3">
<!-- Word Item 1 -->
<div class="bg-soft-lilac/40 organic-card-1 p-3.5 flex items-center justify-between group cursor-pointer hover:bg-soft-lilac/60 transition-colors shadow-sm">
<span class="font-headline-h2 text-headline-h2 text-primary ml-2">害怕</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/80 backdrop-blur-sm shadow-sm flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Word Item 2 -->
<div class="bg-secondary-container/40 organic-card-2 p-3.5 flex items-center justify-between group cursor-pointer hover:bg-secondary-container/60 transition-colors shadow-sm">
<span class="font-headline-h2 text-headline-h2 text-primary ml-2">风格</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/80 backdrop-blur-sm shadow-sm flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Word Item 3 -->
<div class="bg-secondary-container/40 organic-card-3 p-3.5 flex items-center justify-between group cursor-pointer hover:bg-secondary-container/60 transition-colors shadow-sm">
<span class="font-headline-h2 text-headline-h2 text-primary ml-2">小菜</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/80 backdrop-blur-sm shadow-sm flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Word Item 4 -->
<div class="bg-soft-lilac/40 organic-card-4 p-3.5 flex items-center justify-between group cursor-pointer hover:bg-soft-lilac/60 transition-colors shadow-sm">
<span class="font-headline-h2 text-headline-h2 text-primary ml-2">小红</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/80 backdrop-blur-sm shadow-sm flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Word Item 5 -->
<div class="bg-soft-lilac/40 organic-card-2 p-3.5 flex items-center justify-between group cursor-pointer hover:bg-soft-lilac/60 transition-colors shadow-sm">
<span class="font-headline-h2 text-headline-h2 text-primary ml-2">风光</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/80 backdrop-blur-sm shadow-sm flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Word Item 6 -->
<div class="bg-secondary-container/40 organic-card-1 p-3.5 flex items-center justify-between group cursor-pointer hover:bg-secondary-container/60 transition-colors shadow-sm">
<span class="font-headline-h2 text-headline-h2 text-primary ml-2">好评</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/80 backdrop-blur-sm shadow-sm flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Word Item 7 -->
<div class="bg-secondary-container/40 organic-card-4 p-3.5 flex items-center justify-between group cursor-pointer hover:bg-secondary-container/60 transition-colors shadow-sm">
<span class="font-headline-h2 text-headline-h2 text-primary ml-2">自然</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/80 backdrop-blur-sm shadow-sm flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
<!-- Word Item 8 -->
<div class="bg-soft-lilac/40 organic-card-3 p-3.5 flex items-center justify-between group cursor-pointer hover:bg-soft-lilac/60 transition-colors shadow-sm">
<span class="font-headline-h2 text-headline-h2 text-primary ml-2">小猫</span>
<button class="w-8 h-8 rounded-full bg-surface-container-lowest/80 backdrop-blur-sm shadow-sm flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
</div>
</div>
<!-- Floating Pill Button -->
<div class="absolute -bottom-7 left-0 right-0 flex justify-center">
<button class="w-10/12 bg-primary text-on-primary rounded-full h-14 font-headline-h2 text-headline-h2 flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_10px_25px_rgba(0,0,0,0.2)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">playlist_play</span>
                顺序播放
            </button>
</div>
</div>
</div>
